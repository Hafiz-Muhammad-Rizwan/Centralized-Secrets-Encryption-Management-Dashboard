name: Validate server application

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npx eslint src scripts tests next.config.ts
      - run: npm run build
# Deployment is handled by Vercel. GitHub Pages cannot run server-side auth.
