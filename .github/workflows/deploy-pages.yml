name: Retire legacy GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the obsolete Pages site
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status=$(curl --silent --show-error --output /tmp/pages-response --write-out '%{http_code}' \
            --request DELETE --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/pages")
          case "$status" in
            204|404) echo 'Pages site removed or already absent.' ;;
            *) echo "Pages retirement failed (HTTP $status). Unpublish in repository Settings > Pages."; exit 1 ;;
          esac
